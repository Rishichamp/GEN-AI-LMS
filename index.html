<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ninja — GenAI Builder Program</title>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@tabler/icons-webfont@3.49.0/dist/tabler-icons.min.css">
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --ink:#0a0c12;
  --ink-1:#10131b;
  --ink-2:#161a24;
  --ink-3:#1d212d;
  --ink-4:#262b38;
  --hair:rgba(255,255,255,.07);
  --hair-strong:rgba(255,255,255,.13);
  --paper:#eef0f4;
  --paper-dim:#9aa1b0;
  --paper-faint:#5d6376;
  --signal:#8b88f5;
  --signal-dim:#5a57c9;
  --signal-bg:rgba(139,136,245,.1);
  --signal-bg-strong:rgba(139,136,245,.16);
  --sage:#7fb88f;
  --sage-bg:rgba(127,184,143,.1);
  --amber:#d9a455;
  --amber-bg:rgba(217,164,85,.1);
  --rose:#d97a7a;
  --rose-bg:rgba(217,122,122,.1);
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  --font-sans:'Inter',-apple-system,sans-serif;
  --radius-sm:6px;
  --radius:10px;
  --radius-lg:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--ink);
  color:var(--paper);
  font-family:var(--font-sans);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
#root{height:100vh}
::selection{background:var(--signal-bg-strong);color:var(--paper)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--ink-4);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:var(--paper-faint)}

/* ============================================================
   LAYOUT SHELL
   ============================================================ */
.shell{display:flex;height:100vh;width:100%}

/* ---- Sidebar ---- */
.rail{
  width:236px;
  flex-shrink:0;
  background:var(--ink-1);
  border-right:1px solid var(--hair);
  display:flex;
  flex-direction:column;
  height:100%;
}
.rail-brand{
  padding:18px 18px 14px;
  display:flex;
  align-items:center;
  gap:10px;
  border-bottom:1px solid var(--hair);
}
.brand-mark{
  width:28px;height:28px;border-radius:7px;
  background:linear-gradient(155deg,var(--signal) 0%,var(--signal-dim) 100%);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.brand-mark svg{width:15px;height:15px}
.brand-text{display:flex;flex-direction:column;gap:1px;min-width:0}
.brand-name{font-size:13px;font-weight:600;color:var(--paper);letter-spacing:-.01em}
.brand-sub{font-size:10.5px;color:var(--paper-faint);font-family:var(--font-mono)}

.rail-identity{
  padding:13px 18px;
  border-bottom:1px solid var(--hair);
  display:flex;
  align-items:center;
  gap:9px;
}
.id-avatar{
  width:30px;height:30px;border-radius:50%;
  background:var(--ink-3);border:1px solid var(--hair-strong);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:600;color:var(--paper-dim);
  flex-shrink:0;
}
.id-meta{min-width:0}
.id-name{font-size:12.5px;font-weight:500;color:var(--paper);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.id-role{font-size:10.5px;color:var(--paper-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.rail-progress{padding:13px 18px;border-bottom:1px solid var(--hair)}
.rp-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.rp-label{font-size:10px;color:var(--paper-faint);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.06em}
.rp-value{font-size:11px;color:var(--signal);font-family:var(--font-mono);font-weight:500}
.rp-track{height:3px;background:var(--ink-3);border-radius:99px;overflow:hidden}
.rp-fill{height:100%;background:var(--signal);border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}

.rail-nav{flex:1;overflow-y:auto;padding:10px 10px}
.nav-group{margin-bottom:4px}
.nav-group-label{
  padding:12px 8px 5px;
  font-size:10px;
  color:var(--paper-faint);
  font-family:var(--font-mono);
  text-transform:uppercase;
  letter-spacing:.07em;
}
.nav-item{
  display:flex;align-items:center;gap:9px;
  padding:7px 8px;
  border-radius:var(--radius-sm);
  cursor:pointer;
  font-size:12.5px;
  color:var(--paper-dim);
  transition:background .12s, color .12s;
  position:relative;
  border:none;background:none;width:100%;text-align:left;
  font-family:var(--font-sans);
}
.nav-item:hover{background:var(--ink-2);color:var(--paper)}
.nav-item.active{background:var(--signal-bg);color:var(--paper)}
.nav-item.active::before{
  content:'';position:absolute;left:-10px;top:50%;transform:translateY(-50%);
  width:3px;height:14px;background:var(--signal);border-radius:0 3px 3px 0;
}
.nav-item i{font-size:15px;width:16px;text-align:center;flex-shrink:0;color:inherit;opacity:.85}
.nav-item.active i{color:var(--signal);opacity:1}
.nav-item-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-badge{
  font-size:9.5px;font-family:var(--font-mono);
  padding:1px 6px;border-radius:99px;
  flex-shrink:0;font-weight:500;
}
.nb-rose{background:var(--rose-bg);color:var(--rose)}
.nb-sage{background:var(--sage-bg);color:var(--sage)}
.nb-amber{background:var(--amber-bg);color:var(--amber)}
.nb-dim{background:var(--ink-3);color:var(--paper-faint)}

.rail-footer{padding:11px 14px;border-top:1px solid var(--hair)}
.streak-row{display:flex;align-items:center;gap:8px}
.streak-icon{
  width:26px;height:26px;border-radius:7px;
  background:var(--amber-bg);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.streak-icon i{font-size:13px;color:var(--amber)}
.streak-text{display:flex;flex-direction:column;gap:0;min-width:0}
.streak-num{font-size:12.5px;font-weight:600;color:var(--paper);font-family:var(--font-mono)}
.streak-label{font-size:10px;color:var(--paper-faint)}

/* ---- Main column ---- */
.main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}

.topbar{
  height:52px;flex-shrink:0;
  display:flex;align-items:center;gap:12px;
  padding:0 22px;
  border-bottom:1px solid var(--hair);
  background:var(--ink);
}
.crumb{font-size:11px;color:var(--paper-faint);font-family:var(--font-mono)}
.crumb-sep{color:var(--ink-4)}
.crumb-current{color:var(--paper-dim)}
.topbar-spacer{flex:1}
.search-trigger{
  display:flex;align-items:center;gap:7px;
  padding:6px 10px;
  background:var(--ink-2);
  border:1px solid var(--hair);
  border-radius:var(--radius-sm);
  color:var(--paper-faint);
  font-size:11.5px;
  cursor:pointer;
  width:200px;
  transition:border-color .12s;
}
.search-trigger:hover{border-color:var(--hair-strong)}
.search-trigger i{font-size:14px}
.kbd{
  margin-left:auto;
  font-family:var(--font-mono);font-size:9.5px;
  background:var(--ink-3);border:1px solid var(--hair-strong);
  padding:1px 5px;border-radius:4px;color:var(--paper-faint);
}
.icon-btn{
  width:32px;height:32px;border-radius:var(--radius-sm);
  display:flex;align-items:center;justify-content:center;
  background:none;border:1px solid transparent;
  color:var(--paper-dim);cursor:pointer;
  transition:background .12s, border-color .12s;
  position:relative;
}
.icon-btn:hover{background:var(--ink-2);border-color:var(--hair)}
.icon-btn i{font-size:16px}
.notif-dot{
  position:absolute;top:6px;right:6px;
  width:6px;height:6px;border-radius:50%;
  background:var(--rose);border:2px solid var(--ink);
}

.content{flex:1;overflow-y:auto;padding:26px 30px 60px}
.content-inner{max-width:1080px;margin:0 auto}

/* ============================================================
   TYPOGRAPHY
   ============================================================ */
.page-eyebrow{
  font-family:var(--font-mono);font-size:11px;
  color:var(--signal);text-transform:uppercase;letter-spacing:.08em;
  margin-bottom:6px;display:flex;align-items:center;gap:8px;
}
.page-title{font-size:23px;font-weight:600;color:var(--paper);letter-spacing:-.015em;margin-bottom:5px}
.page-sub{font-size:13px;color:var(--paper-faint);line-height:1.55}
.section-label{
  font-family:var(--font-mono);font-size:10.5px;
  color:var(--paper-faint);text-transform:uppercase;letter-spacing:.07em;
  margin-bottom:11px;display:flex;align-items:center;gap:7px;
}
h2.h{font-size:16px;font-weight:600;color:var(--paper);letter-spacing:-.01em}
h3.h{font-size:13px;font-weight:600;color:var(--paper)}
p.muted{font-size:12.5px;color:var(--paper-dim);line-height:1.65}
.fine{font-size:11px;color:var(--paper-faint)}

/* ============================================================
   COMPONENTS — PRIMITIVES
   ============================================================ */
.row{display:flex;align-items:center}
.between{display:flex;align-items:center;justify-content:space-between}
.col{display:flex;flex-direction:column}
.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g16{gap:16px}.g20{gap:20px}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

.panel{
  background:var(--ink-1);
  border:1px solid var(--hair);
  border-radius:var(--radius);
  padding:16px;
}
.panel-tight{padding:13px 14px}
.panel-accent{border-color:rgba(139,136,245,.25);background:linear-gradient(180deg,rgba(139,136,245,.05),rgba(139,136,245,.02))}
.panel-sage{border-color:rgba(127,184,143,.22);background:rgba(127,184,143,.04)}
.panel-amber{border-color:rgba(217,164,85,.22);background:rgba(217,164,85,.04)}
.panel-rose{border-color:rgba(217,122,122,.22);background:rgba(217,122,122,.04)}

.stat{padding:14px 16px;background:var(--ink-1);border:1px solid var(--hair);border-radius:var(--radius)}
.stat-num{font-family:var(--font-mono);font-size:22px;font-weight:600;color:var(--paper);letter-spacing:-.02em}
.stat-label{font-size:11px;color:var(--paper-faint);margin-top:3px}
.stat-delta{font-size:10.5px;margin-top:5px;font-family:var(--font-mono)}

.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 13px;
  border-radius:var(--radius-sm);
  font-size:12px;font-weight:500;
  font-family:var(--font-sans);
  cursor:pointer;
  border:1px solid var(--hair-strong);
  background:var(--ink-2);
  color:var(--paper-dim);
  transition:background .12s, border-color .12s, color .12s, transform .08s;
  white-space:nowrap;
}
.btn:hover:not(:disabled){background:var(--ink-3);color:var(--paper);border-color:rgba(255,255,255,.18)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--signal);border-color:var(--signal);color:#0a0c12;font-weight:600}
.btn-primary:hover:not(:disabled){background:#9c99ff;border-color:#9c99ff}
.btn-ghost{background:none;border-color:transparent}
.btn-ghost:hover:not(:disabled){background:var(--ink-2)}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-icon{padding:7px;width:32px;height:32px;justify-content:center}

.pill{
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 8px;border-radius:99px;
  font-size:10px;font-weight:500;font-family:var(--font-mono);
  border:1px solid;
}
.pill-signal{background:var(--signal-bg);color:var(--signal);border-color:rgba(139,136,245,.3)}
.pill-sage{background:var(--sage-bg);color:var(--sage);border-color:rgba(127,184,143,.3)}
.pill-amber{background:var(--amber-bg);color:var(--amber);border-color:rgba(217,164,85,.3)}
.pill-rose{background:var(--rose-bg);color:var(--rose);border-color:rgba(217,122,122,.3)}
.pill-dim{background:var(--ink-3);color:var(--paper-faint);border-color:var(--hair)}

.bar-track{height:4px;background:var(--ink-3);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.bf-signal{background:var(--signal)}
.bf-sage{background:var(--sage)}
.bf-amber{background:var(--amber)}
.bf-rose{background:var(--rose)}

.divider{height:1px;background:var(--hair);margin:14px 0}
.divider-v{width:1px;background:var(--hair);align-self:stretch}

.input{
  width:100%;
  background:var(--ink-2);
  border:1px solid var(--hair-strong);
  border-radius:var(--radius-sm);
  padding:8px 11px;
  color:var(--paper);
  font-size:12.5px;
  font-family:var(--font-sans);
  outline:none;
  transition:border-color .12s;
}
.input:focus{border-color:var(--signal)}
.input::placeholder{color:var(--paper-faint)}
textarea.input{resize:vertical;line-height:1.6;font-family:var(--font-sans)}
select.input{cursor:pointer}

.spinner{
  display:inline-block;width:12px;height:12px;
  border:2px solid rgba(139,136,245,.25);border-top-color:var(--signal);
  border-radius:50%;animation:spin .65s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.toast{
  position:fixed;bottom:20px;right:20px;z-index:999;
  background:var(--ink-2);border:1px solid var(--hair-strong);
  border-radius:var(--radius);
  padding:11px 15px;
  display:flex;align-items:center;gap:9px;
  font-size:12px;color:var(--paper);
  box-shadow:0 10px 40px rgba(0,0,0,.4);
  animation:toastIn .25s cubic-bezier(.16,1,.3,1);
  max-width:300px;
}
@keyframes toastIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.toast-icon{
  width:22px;height:22px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--sage-bg);color:var(--sage);font-size:11px;
}

/* tabs */
.tabset{display:flex;gap:2px;background:var(--ink-2);padding:3px;border-radius:var(--radius-sm);border:1px solid var(--hair)}
.tab{
  flex:1;text-align:center;padding:6px 10px;border-radius:5px;
  font-size:11.5px;font-weight:500;cursor:pointer;color:var(--paper-faint);
  transition:background .12s, color .12s;
  border:none;background:none;font-family:var(--font-sans);
}
.tab.active{background:var(--ink-4);color:var(--paper)}

/* ============================================================
   COMPONENTS — DOMAIN SPECIFIC
   ============================================================ */

/* Module / lesson card */
.module-card{
  display:flex;align-items:flex-start;gap:13px;
  padding:14px 15px;
  background:var(--ink-1);
  border:1px solid var(--hair);
  border-radius:var(--radius);
  cursor:pointer;
  transition:border-color .14s, background .14s, transform .1s;
}
.module-card:hover{border-color:var(--hair-strong);background:var(--ink-2)}
.module-card:active{transform:scale(.995)}
.module-card.locked{opacity:.5;cursor:not-allowed}
.module-card.locked:hover{border-color:var(--hair);background:var(--ink-1)}
.module-card.active-mod{border-color:rgba(139,136,245,.3);background:linear-gradient(180deg,rgba(139,136,245,.06),transparent)}
.module-card.done-mod{border-color:rgba(127,184,143,.22)}

.module-icon{
  width:34px;height:34px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-size:15px;
}

/* Knowledge graph mini-thread (signature element, lives in sidebar) */
.kg-thread{padding:11px 14px;border-top:1px solid var(--hair)}
.kg-node-row{display:flex;align-items:center;gap:0;position:relative}
.kg-node{
  width:7px;height:7px;border-radius:50%;flex-shrink:0;
  position:relative;z-index:1;
}
.kg-node.done{background:var(--sage)}
.kg-node.cur{background:var(--signal);box-shadow:0 0 0 3px var(--signal-bg)}
.kg-node.todo{background:var(--ink-4);border:1px solid var(--hair-strong)}
.kg-line{flex:1;height:1px;background:var(--hair-strong);margin:0 1px}
.kg-line.filled{background:var(--sage)}

/* Code block */
.code-block{
  background:#06070b;
  border:1px solid var(--hair);
  border-radius:var(--radius);
  overflow:hidden;
}
.code-bar{
  display:flex;align-items:center;gap:8px;
  padding:7px 12px;
  background:var(--ink-1);
  border-bottom:1px solid var(--hair);
}
.code-dots{display:flex;gap:4px}
.code-dot{width:7px;height:7px;border-radius:50%;background:var(--ink-4)}
.code-lang{font-family:var(--font-mono);font-size:10.5px;color:var(--paper-faint);margin-right:auto}
.code-area{
  width:100%;min-height:130px;
  background:transparent;color:#dde2ee;
  font-family:var(--font-mono);font-size:11.5px;line-height:1.7;
  padding:13px 15px;border:none;outline:none;resize:vertical;
}
.code-output{
  background:#040508;border-top:1px solid var(--hair);
  padding:11px 15px;
}
.code-output-label{font-family:var(--font-mono);font-size:9.5px;color:var(--paper-faint);letter-spacing:.06em;margin-bottom:5px}
.code-output-text{font-family:var(--font-mono);font-size:11px;color:#9ce8b0;white-space:pre-wrap;line-height:1.65}

/* Flashcard */
.flashcard-stage{perspective:1000px;cursor:pointer;user-select:none}
.flashcard-inner{transition:transform .5s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d;position:relative}
.flashcard-stage.flipped .flashcard-inner{transform:rotateY(180deg)}
.flashcard-face{
  backface-visibility:hidden;
  background:var(--ink-1);border:1px solid var(--hair-strong);
  border-radius:var(--radius-lg);
  padding:34px 28px;min-height:170px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
}
.flashcard-back{transform:rotateY(180deg);position:absolute;inset:0}
.fc-label{font-family:var(--font-mono);font-size:10px;color:var(--paper-faint);letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}
.fc-q{font-size:15px;font-weight:500;color:var(--paper);line-height:1.6}
.fc-a{font-size:13px;color:var(--paper-dim);line-height:1.7}

.grade-row{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}
.grade-btn{
  padding:9px 6px;text-align:center;border-radius:var(--radius-sm);
  border:1px solid;cursor:pointer;transition:all .12s;
  font-size:11px;font-weight:500;background:var(--ink-2);
}
.grade-btn .gsub{display:block;font-size:9.5px;font-family:var(--font-mono);margin-top:2px;opacity:.7}
.g-again{color:var(--rose);border-color:rgba(217,122,122,.25)}.g-again:hover{background:var(--rose-bg)}
.g-hard{color:var(--amber);border-color:rgba(217,164,85,.25)}.g-hard:hover{background:var(--amber-bg)}
.g-good{color:var(--signal);border-color:rgba(139,136,245,.25)}.g-good:hover{background:var(--signal-bg)}
.g-easy{color:var(--sage);border-color:rgba(127,184,143,.25)}.g-easy:hover{background:var(--sage-bg)}

/* Quiz option */
.quiz-option{
  display:flex;align-items:center;gap:10px;
  padding:10px 13px;
  border:1px solid var(--hair-strong);border-radius:var(--radius-sm);
  cursor:pointer;margin-bottom:7px;
  transition:all .12s;
  font-size:12.5px;color:var(--paper-dim);
}
.quiz-option:hover{border-color:rgba(255,255,255,.22);background:var(--ink-2);color:var(--paper)}
.quiz-option.selected{border-color:var(--signal);background:var(--signal-bg);color:var(--paper)}
.quiz-option.correct{border-color:var(--sage);background:var(--sage-bg);color:var(--sage)}
.quiz-option.wrong{border-color:var(--rose);background:var(--rose-bg);color:var(--rose)}
.qo-letter{
  width:21px;height:21px;border-radius:5px;
  background:var(--ink-3);
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-family:var(--font-mono);font-weight:500;flex-shrink:0;
}

/* Chat / mentor */

/* Derive enriched module list from catalogue + live progress state */
function enrichModules(catalogue, progressMap){
  return catalogue.map(m=>{
    const completedLessons = progressMap[m.id] || 0;
    const progress = Math.round((completedLessons / m.totalLessons) * 100);
    const prereqsMet = m.prereq.every(pid=>{
      const p = progressMap[pid] || 0;
      return p >= catalogue.find(c=>c.id===pid).totalLessons;
    });
    let status;
    if(progress >= 100) status = "done";
    else if(completedLessons > 0) status = "active";
    else if(prereqsMet) status = "available";
    else status = "locked";
    return {...m, progress, completedLessons, status};
  });
}

function enrichLessons(moduleId, completedCount){

function MentorMini({showToast,moduleName="this module"}){
  const [input,setInput]=useState("");
  const [last,setLast]=useState("Ask anything about this lesson.");
  const [loading,setLoading]=useState(false);
  const ask=useClaude();

  const send=async(text)=>{
    if(!text.trim())return;
    setInput("");setLoading(true);
    const reply=await ask(`You are an expert AI tutor for an M.Tech AI student. Current module: ${moduleName}. Be concise, under 100 words.`,text);
    if(reply){setLast(reply);}
    else{
      const key=Object.keys(FALLBACK_REPLIES).find(k=>text.toLowerCase().includes(k));
      setLast(key?FALLBACK_REPLIES[key]:"Good question — ask me to go deeper on any concept from this lesson and I'll explain with examples.");
    }
    setLoading(false);
  };

  return (
    <div className="panel">
      <h3 className="h" style={{marginBottom:9}}>Mentor</h3>
      <div className="panel-tight" style={{background:"var(--ink-2)",borderRadius:8,marginBottom:9,minHeight:50}}>
        <p style={{fontSize:11.5,color:"var(--paper-dim)",lineHeight:1.6}}>{loading?<span className="spinner"/>:last}</p>
      </div>
      <div className="row g6">
        <input className="input" placeholder="Ask about ChromaDB…" value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send(input)}/>
        <button className="btn btn-icon btn-primary" onClick={()=>send(input)} aria-label="Send"><i className="ti ti-send"></i></button>
      </div>
    </div>
  );
}

function MentorView({showToast,modules}){
  const activeMod=modules.find(m=>m.status==="active");
  const doneMods=modules.filter(m=>m.status==="done");
  const context=activeMod
    ?`Current focus: ${activeMod.title} (${activeMod.progress}% complete).`
    :"No active module yet — user is just starting.";
  const doneContext=doneMods.length>0
    ?`Completed modules: ${doneMods.map(m=>m.title).join(", ")}.`
    :"No completed modules yet.";
  const systemPrompt=`You are an expert AI tutor for King, an M.Tech AI student at IIT(ISM) Dhanbad with a strong PyTorch background, published Lighthouse Attention (arXiv:2605.06554). ${context} ${doneContext} Give concise, technical answers under 150 words.`;
  const [msgs,setMsgs]=useState(MENTOR_SEED);
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const ask=useClaude();
  const endRef=useRef(null);

  useEffect(()=>{endRef.current?.scrollIntoView({behavior:"smooth"});},[msgs]);

  const send=async(text)=>{
    if(!text.trim()||loading)return;
    setMsgs(m=>[...m,{role:"user",text}]);
    setInput("");setLoading(true);
    const reply=await ask(systemPrompt,text);
    if(reply){setMsgs(m=>[...m,{role:"ai",text:reply}]);}
    else{
      const key=Object.keys(FALLBACK_REPLIES).find(k=>text.toLowerCase().includes(k));
      setMsgs(m=>[...m,{role:"ai",text:key?FALLBACK_REPLIES[key]:"That's a great question — could you narrow it to a specific concept, technique, or trade-off you'd like unpacked?"}]);
    }
    setLoading(false);
  };

  return (
    <div className="content-inner" style={{maxWidth:680}}>
      <Crumb trail={["Mentor"]}/>
      <div className="page-title" style={{marginTop:8,fontSize:19}}>AI mentor</div>

      <div className="chat-shell" style={{height:480}}>
        <div className="chat-stream">
          {msgs.map((m,i)=>(
            <div key={i} className={`msg-row ${m.role==="user"?"user":""}`}>
              <div className={`msg-avatar ${m.role}`}>{m.role==="ai"?<i className="ti ti-sparkles" style={{fontSize:11}}></i>:"K"}</div>
              <div className={`msg-bubble ${m.role}`}>{m.text}</div>
            </div>
          ))}
          {loading && (
            <div className="msg-row">
              <div className="msg-avatar ai"><i className="ti ti-sparkles" style={{fontSize:11}}></i></div>
              <div className="msg-bubble ai"><span className="spinner"/></div>
            </div>
          )}
          <div ref={endRef}/>
        </div>
        <div className="chip-row">
          {QUICK_PROMPTS.map(q=>(<button key={q} className="suggest-chip" onClick={()=>send(q)}>{q}</button>))}
        </div>
        <div className="chat-input-row">
          <input className="input" placeholder="Ask anything about the course…" value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send(input)}/>
          <button className="btn btn-icon btn-primary" onClick={()=>send(input)} disabled={loading||!input.trim()} aria-label="Send"><i className="ti ti-send"></i></button>
        </div>
      </div>
    </div>
  );

  const max=Math.max(...studyData,1);
  return (
    <div className="content-inner">
      <Crumb trail={["Analytics"]}/>
      <div className="page-title" style={{marginTop:8,fontSize:19}}>Analytics</div>
      <p className="page-sub" style={{marginBottom:20}}>Your real-time progress — updates as you complete lessons and quizzes.</p>

      <div className="grid-4" style={{marginBottom:20}}>
        <Stat value={`${overallPct}%`} label="Overall progress" delta={`${totalCompleted} of ${totalLessons} lessons`} tone="signal"/>
        <Stat value={xp} label="XP earned" delta={xp===0?"Complete lessons to earn XP":"keep going!"} tone="amber"/>
        <Stat value={modules.filter(m=>m.status==="done").length} label="Modules complete" delta={`${modules.filter(m=>m.status==="active").length} in progress`} tone="sage"/>
        <Stat value={totalCompleted} label="Lessons complete" tone="signal"/>
      </div>

      <div className="grid-2" style={{gap:18}}>
        <div className="panel">
          <h3 className="h" style={{marginBottom:12}}>Activity (lessons completed)</h3>
          {totalCompleted===0 ? (
            <div className="empty-state" style={{padding:"24px 0"}}>
              <div className="empty-icon"><i className="ti ti-chart-bar"></i></div>
              <div className="empty-title">No activity yet</div>
              <div className="empty-sub">Complete your first lesson to see activity here.</div>
            </div>
          ) : (
            <div className="spark">
              {studyData.map((v,i)=>(
                <div key={i} className="spark-bar" style={{
                  height:`${(v/max)*100}%`,
                  background:v>35?"var(--signal)":v>15?"rgba(139,136,245,.5)":"var(--ink-3)"
                }}/>
              ))}
            </div>
          )}
        </div>
        <div className="panel">
          <h3 className="h" style={{marginBottom:12}}>Module progress</h3>
          <div className="col g10">
            {modules.map(m=>(
              <div key={m.id}>
                <div className="between fine" style={{marginBottom:4}}>
                  <span style={{color:"var(--paper-dim)"}}>{m.title}</span>
                  <span>{m.progress}%</span>
                </div>
                <ProgressBar pct={m.progress} tone={m.status==="done"?"sage":m.status==="locked"?"amber":"signal"}/>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

function CommandPalette({open,onClose,nav}){
  const [q,setQ]=useState("");
  const inputRef=useRef(null);
  useEffect(()=>{if(open)setTimeout(()=>inputRef.current?.focus(),50);},[open]);

  if(!open)return null;
  const pool=[
    {label:"Continue lesson — ChromaDB deep dive",view:"lesson",icon:"book-open"},
    {label:"Review flashcards",view:"review",icon:"cards"},
    {label:"Ask the mentor",view:"mentor",icon:"sparkles"},
    {label:"View roadmap",view:"roadmap",icon:"route"},
    {label:"Project portfolio",view:"portfolio",icon:"briefcase"},
    {label:"Learning journal",view:"journal",icon:"notebook"},
    {label:"Analytics",view:"analytics",icon:"chart-bar"},
  ];
  const filtered=pool.filter(p=>p.label.toLowerCase().includes(q.toLowerCase()));

  return (
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",zIndex:200,display:"flex",alignItems:"flex-start",justifyContent:"center",paddingTop:"12vh"}}>
      <div onClick={e=>e.stopPropagation()} style={{width:480,background:"var(--ink-1)",border:"1px solid var(--hair-strong)",borderRadius:14,overflow:"hidden",boxShadow:"0 20px 60px rgba(0,0,0,.5)"}}>
        <div className="row g8" style={{padding:"12px 16px",borderBottom:"1px solid var(--hair)"}}>
          <i className="ti ti-search" style={{color:"var(--paper-faint)"}}></i>
          <input ref={inputRef} className="input" style={{background:"none",border:"none",padding:0}} placeholder="Search modules, lessons, actions…" value={q} onChange={e=>setQ(e.target.value)}/>
          <span className="kbd">esc</span>
        </div>
        <div style={{maxHeight:300,overflowY:"auto",padding:6}}>
          {filtered.map((p,i)=>(
            <div key={i} className="nav-item" style={{width:"100%"}} onClick={()=>{nav(p.view);onClose();}}>
              <i className={`ti ti-${p.icon}`}></i>
              <span className="nav-item-label">{p.label}</span>
            </div>
          ))}
          {filtered.length===0 && <div className="fine" style={{padding:14,textAlign:"center"}}>No matches</div>}
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   SIDEBAR
   ============================================================ */
function Sidebar({view,nav,modules,overallPct,xp,streak,resetProgress}){
  const NavGroup=({label,items})=>(
    <div className="nav-group">
      <div className="nav-group-label">{label}</div>
      {items.map(it=>(
        <button key={it.id} className={`nav-item ${view===it.id?"active":""}`} onClick={()=>nav(it.id)}>
          <i className={`ti ti-${it.icon}`}></i>
          <span className="nav-item-label">{it.label}</span>
          {it.badge && <span className={`nav-badge ${it.badgeTone}`}>{it.badge}</span>}
        </button>
      ))}
    </div>
  );

  return (
    <div className="rail">
      <div className="rail-brand">
        <div className="brand-mark">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 2L4 7v10l8 5 8-5V7l-8-5z" stroke="#0a0c12" strokeWidth="2" strokeLinejoin="round"/></svg>
        </div>
        <div className="brand-text">
          <div className="brand-name">Ninja</div>
          <div className="brand-sub">genai builder</div>
        </div>
      </div>

      <div className="rail-identity">
        <div className="id-avatar">K</div>
        <div className="id-meta">
          <div className="id-name">King</div>
          <div className="id-role">IIT (ISM) Dhanbad</div>
        </div>
      </div>

      <div className="rail-progress">
        <div className="rp-top">
          <span className="rp-label">Overall</span>
          <span className="rp-value">{overallPct}%</span>
        </div>
        <div className="rp-track"><div className="rp-fill" style={{width:`${overallPct}%`}}/></div>
      </div>

      <div className="kg-thread">
        <div className="kg-node-row">
          {modules.map((m,i)=>(
            <React.Fragment key={m.id}>
              <div className={`kg-node ${m.status==="done"?"done":m.status==="active"?"cur":"todo"}`} title={m.title}/>
              {i<modules.length-1 && <div className={`kg-line ${modules[i].status==="done"?"filled":""}`}/>}
            </React.Fragment>
          ))}
        </div>
      </div>

      <div className="rail-nav">
        <NavGroup label="Learn" items={[
          {id:"dashboard",label:"Dashboard",icon:"layout-dashboard"},
          {id:"lesson",label:"Current lesson",icon:"book-open"},
          {id:"roadmap",label:"Roadmap",icon:"route"},
        ]}/>
        <NavGroup label="Practice" items={[
          {id:"review",label:"Spaced review",icon:"cards",badge:"2",badgeTone:"nb-rose"},
          {id:"mentor",label:"AI mentor",icon:"sparkles"},
        ]}/>
        <NavGroup label="Track" items={[
          {id:"portfolio",label:"Portfolio",icon:"briefcase"},
          {id:"journal",label:"Journal",icon:"notebook"},
          {id:"analytics",label:"Analytics",icon:"chart-bar"},
        ]}/>
      </div>

      <div className="rail-footer">
        <div className="streak-row" style={{marginBottom:8}}>
          <div className="streak-icon"><i className="ti ti-bolt"></i></div>
          <div className="streak-text">
            <span className="streak-num">{xp} XP</span>
            <span className="streak-label">earned so far</span>
          </div>
        </div>
        <button
          onClick={resetProgress}
          style={{width:"100%",fontSize:10,padding:"5px 0",background:"none",border:"1px solid var(--hair)",borderRadius:6,color:"var(--paper-faint)",cursor:"pointer",fontFamily:"var(--font-mono)"}}
        >reset progress</button>
      </div>
    </div>
  );
}

/* ============================================================
   ROOT APP
   ============================================================ */
const VIEW_META={
  dashboard:{title:"Dashboard",trail:["Dashboard"]},
  lesson:{title:"Lesson",trail:["Learn","Current lesson"]},
  roadmap:{title:"Roadmap",trail:["Learn","Roadmap"]},
  review:{title:"Review",trail:["Practice","Spaced review"]},
  mentor:{title:"Mentor",trail:["Mentor"]},
  portfolio:{title:"Portfolio",trail:["Portfolio"]},
  journal:{title:"Journal",trail:["Journal"]},
  analytics:{title:"Analytics",trail:["Analytics"]},
};

/* ── localStorage helpers ── */
const STORAGE_KEY="ninja_lms_v1";
function loadState(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    return raw?JSON.parse(raw):null;
  }catch{return null;}
}
function saveState(s){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(s));}catch{}
}

const DEFAULT_STATE={
  /* progressMap: {moduleId -> completedLessonCount} */
  progressMap:{},
  xp:0,
  streak:0,
  lastStudiedDate:null,
  reviewedCards:[],
  goals:[
    {id:1,label:"Complete your first lesson",done:false,xp:30},
    {id:2,label:"Review a flashcard",done:false,xp:20},
    {id:3,label:"Write a journal entry",done:false,xp:10},
    {id:4,label:"Score 80%+ on a quiz",done:false,xp:100},
  ],
};

function App(){
  const [booted,setBooted]=useState(false);
  const [view,setView]=useState("dashboard");
  const [paletteOpen,setPaletteOpen]=useState(false);
  const [toast,showToast]=useToast();

  /* ── Core learner state, persisted to localStorage ── */
  const [appState,setAppState]=useState(()=>{
    const saved=loadState();
    return saved?{...DEFAULT_STATE,...saved}:DEFAULT_STATE;
  });

  /* Persist on every change */
  useEffect(()=>saveState(appState),[appState]);

  /* Derived module list — recomputed whenever progressMap changes */
  const modules=useMemo(()=>enrichModules(MODULE_CATALOGUE,appState.progressMap),[appState.progressMap]);

  /* Overall progress = total completed lessons / total lessons */
  const totalLessons=MODULE_CATALOGUE.reduce((s,m)=>s+m.totalLessons,0);
  const totalCompleted=Object.values(appState.progressMap).reduce((s,v)=>s+v,0);
  const overallPct=Math.round((totalCompleted/totalLessons)*100);

  /* Unlock a single lesson in a module */
  const completeLesson=useCallback((moduleId)=>{
    setAppState(prev=>{
      const cat=MODULE_CATALOGUE.find(m=>m.id===moduleId);
      if(!cat)return prev;
      const current=prev.progressMap[moduleId]||0;
      if(current>=cat.totalLessons)return prev;
      const next=current+1;
      const xpGain=Math.round(cat.xp/cat.totalLessons);
      showToast(`Lesson complete — +${xpGain} XP`,"check");
      return{
        ...prev,
        progressMap:{...prev.progressMap,[moduleId]:next},
        xp:prev.xp+xpGain,
      };
    });
    /* also tick goal 1 */
    setAppState(prev=>({...prev,goals:prev.goals.map(g=>g.id===1?{...g,done:true}:g)}));
  },[showToast]);

  const markQuizPassed=useCallback(()=>{
    setAppState(prev=>({...prev,goals:prev.goals.map(g=>g.id===4?{...g,done:true}:g)}));
  },[]);

  const markCardReviewed=useCallback(()=>{
    setAppState(prev=>({...prev,goals:prev.goals.map(g=>g.id===2?{...g,done:true}:g)}));
  },[]);

  const markJournalEntry=useCallback(()=>{
    setAppState(prev=>({...prev,goals:prev.goals.map(g=>g.id===3?{...g,done:true}:g)}));
  },[]);

  const toggleGoal=useCallback((id)=>{
    setAppState(prev=>{
      const goals=prev.goals.map(g=>{
        if(g.id!==id)return g;
        const done=!g.done;
        if(done&&!g.done)showToast(`+${g.xp} XP`,"bolt");
        return{...g,done};
      });
      return{...prev,goals};
    });
  },[showToast]);

  const resetProgress=useCallback(()=>{
    if(!window.confirm("Reset all progress to zero? This cannot be undone."))return;
    setAppState(DEFAULT_STATE);
    showToast("Progress reset","refresh");
  },[showToast]);

  useEffect(()=>{const t=setTimeout(()=>setBooted(true),650);return()=>clearTimeout(t);},[]);

  useEffect(()=>{
    const onKey=(e)=>{
      if((e.metaKey||e.ctrlKey)&&e.key==="k"){e.preventDefault();setPaletteOpen(p=>!p);}
      if(e.key==="Escape")setPaletteOpen(false);
    };
    window.addEventListener("keydown",onKey);
    return()=>window.removeEventListener("keydown",onKey);
  },[]);

  const nav=(v)=>setView(v);

  if(!booted){
    return (
      <div className="boot">
        <div className="boot-mark">
          <svg viewBox="0 0 24 24" fill="none" width="22" height="22"><path d="M12 2L4 7v10l8 5 8-5V7l-8-5z" stroke="#0a0c12" strokeWidth="2" strokeLinejoin="round"/></svg>
        </div>
        <div className="boot-text">loading workspace…</div>
      </div>
    );
  }

  const meta=VIEW_META[view]||VIEW_META.dashboard;

  return (
    <div className="shell">
      <Sidebar
        view={view} nav={nav}
        modules={modules}
        overallPct={overallPct}
        xp={appState.xp}
        streak={appState.streak}
        resetProgress={resetProgress}
      />
      <div className="main">
        <div className="topbar">
          <Crumb trail={meta.trail}/>
          <div className="topbar-spacer"/>
          <div className="search-trigger" onClick={()=>setPaletteOpen(true)}>
            <i className="ti ti-search"></i>
            <span>Search…</span>
            <span className="kbd">⌘K</span>
          </div>
          <button className="icon-btn" aria-label="Notifications">
            <i className="ti ti-bell"></i>
          </button>
          <button className="icon-btn" aria-label="Settings"><i className="ti ti-settings"></i></button>
        </div>
        <div className="content">
          {view==="dashboard" && (
            <DashboardView
              nav={nav}
              goals={appState.goals}
              toggleGoal={toggleGoal}
              showToast={showToast}
              modules={modules}
              overallPct={overallPct}
              xp={appState.xp}
            />
          )}
          {view==="lesson" && (
            <LessonView
              nav={nav}
              showToast={showToast}
              modules={modules}
              progressMap={appState.progressMap}
              completeLesson={completeLesson}
              markQuizPassed={markQuizPassed}
            />
          )}
          {view==="roadmap" && <RoadmapView modules={modules}/>}
          {view==="review" && <ReviewView showToast={showToast} markCardReviewed={markCardReviewed}/>}
          {view==="mentor" && <MentorView showToast={showToast} modules={modules}/>}
          {view==="portfolio" && <PortfolioView progressMap={appState.progressMap}/>}
          {view==="journal" && <JournalView markJournalEntry={markJournalEntry}/>}
          {view==="analytics" && <AnalyticsView modules={modules} xp={appState.xp} overallPct={overallPct}/>}
        </div>
      </div>
      <CommandPalette open={paletteOpen} onClose={()=>setPaletteOpen(false)} nav={nav}/>
      <Toast toast={toast}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
